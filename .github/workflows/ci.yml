name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Contrôle de mutation la nuit : un seul job, donc pas de sélection par module (MUT-10).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Tests unitaires + couverture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e-tests:
    name: Tests fonctionnels (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Les tests portent sur le site construit, pas sur les sources (CI-14).
      - run: npm run build
        env:
          # Mentions légales de la page À propos (variables du dépôt)
          SIREN: ${{ vars.SIREN }}
          RAISON_SOCIALE: ${{ vars.RAISON_SOCIALE }}
          FORME_JURIDIQUE: ${{ vars.FORME_JURIDIQUE }}
          ADRESSE: ${{ vars.ADRESSE }}
          DIRECTEUR_PUBLICATION: ${{ vars.DIRECTEUR_PUBLICATION }}
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  mutation-testing:
    name: Mutation testing (logique pure)
    # PR et push : sauté (un check sauté compte comme réussi pour le ruleset) ;
    # la nuit et en lancement manuel : mutation complète (MUT-10).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-report
          path: reports/
          retention-days: 14

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Outils de développement uniquement : le site publié n'embarque
      # aucune dépendance npm.
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit complet (production + développement)
        run: node .github/scripts/audit-check.mjs --level=high

  build:
    name: Build de production
    needs: [lint, unit-tests, e2e-tests, mutation-testing, audit]
    # Sans cette condition, `success()` implicite exige que la mutation (sautée sur PR et push) ait réussi : le build serait sauté (MUT-10).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Même build que le déploiement : une erreur de build se voit avant le merge.
      - run: npm run build
        env:
          # Mentions légales de la page À propos (variables du dépôt)
          SIREN: ${{ vars.SIREN }}
          RAISON_SOCIALE: ${{ vars.RAISON_SOCIALE }}
          ADRESSE: ${{ vars.ADRESSE }}
          DIRECTEUR_PUBLICATION: ${{ vars.DIRECTEUR_PUBLICATION }}
